name: Bonds Unified Pipeline

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 BRT — staggered
  push:
    branches: [main]
    paths:
      - 'scripts/bonds/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      preview:
        description: "Run pipeline without sending Telegram"
        type: boolean
        default: false

concurrency:
  group: bonds-unified
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate configuration
        run: |
          test -n "$FRED_API_KEY"
          if [ "${{ github.event_name }}" = "schedule" ] || ( [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.preview }}" != "true" ] ); then
            test -n "$TELEGRAM_BOT_TOKEN"
            test -n "$TELEGRAM_CHAT_ID"
          fi
      - name: Collect, validate and calculate
        run: python -m scripts.bonds.pipeline
      - name: Generate charts
        run: |
          mkdir -p pipelines/bonds
          python scripts/bonds/plot_yields_separate.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --out pipelines/bonds/yields.png
          python scripts/bonds/plot_spreads.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --out pipelines/bonds/spreads.png
          python scripts/bonds/plot_volatility.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --window 30 --annualize --out pipelines/bonds/volatility.png
          python scripts/bonds/plot_zscore.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --window 252 --out pipelines/bonds/zscore.png
          python scripts/bonds/plot_butterfly.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --out pipelines/bonds/butterfly.png
          python scripts/bonds/plot_curve_comparison.py --files pipelines/bonds/us2y_daily.csv pipelines/bonds/us10y_daily.csv pipelines/bonds/us30y_daily.csv --out pipelines/bonds/curve_comparison.png
          test -s pipelines/bonds/yields.png
          test -s pipelines/bonds/spreads.png
          test -s pipelines/bonds/volatility.png
          test -s pipelines/bonds/zscore.png
          test -s pipelines/bonds/butterfly.png
          test -s pipelines/bonds/curve_comparison.png
      - name: Telegram preflight (migration-aware)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.preview != true) }}
        run: |
          python - <<'PY'
          from scripts.bonds.telegram_delivery import send_message
          send_message("<b>Bonds Reports</b> — validação de entrega iniciada.")
          print("Telegram preflight delivery confirmed.")
          PY
      - name: Send charts and executive snapshot
        if: ${{ github.event_name == 'schedule' || inputs.preview != true }}
        run: |
          python - <<'PY'
          from scripts.bonds.telegram_delivery import send_photo, send_message
          files=["curve_comparison.png","yields.png","spreads.png","volatility.png","zscore.png","butterfly.png"]
          for name in files:
              send_photo("pipelines/bonds/"+name, caption="Treasury Bonds | "+name)
          send_message(open("pipelines/bonds/executive.txt",encoding="utf-8").read())
          PY
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonds-report-charts
          path: |
            pipelines/bonds/*.png
            pipelines/bonds/analytics.csv
            pipelines/bonds/executive.txt
            pipelines/bonds/macro_context.txt
          if-no-files-found: error
          retention-days: 7
